name: Deploy to AKS

on:
  push:
    branches:
      - main

env:
  ACR_NAME: ravindraacr2026
  IMAGE_NAME: simple-python-app
  RESOURCE_GROUP: simple-python-rg
  AKS_CLUSTER: simple-python-aks
  NAMESPACE: simple-python-ns

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Log in to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build Docker image
        run: docker build -t ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} .

      - name: Push Docker image
        run: docker push ${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Set AKS context
        run: az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER }} --overwrite-existing

      - name: Update image tag in deploy.yml
        run: sed -i "s|IMAGE_PLACEHOLDER|${{ env.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}|g" k8s/deploy.yml

      - name: Deploy to AKS
        run: |
          kubectl apply -f k8s/deploy.yml -n ${{ env.NAMESPACE }}
          kubectl apply -f k8s/service.yml -n ${{ env.NAMESPACE }}